apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  annotations:
    # Through Cloudflare's proxy, which retries the other worker once when one
    # doesn't answer.
    external-dns.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: public-gateway
      namespace: gateway
      sectionName: https
  # Only www: the bare siegfrid.com is outside the listener's *.siegfrid.com,
  # and a Cloudflare redirect rule sends it here.
  hostnames:
    - www.siegfrid.com
  rules:
    - backendRefs:
        - name: homepage
          port: 80
