apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      securityContext:
        runAsNonRoot: true
        # The image runs as the user `nginx`, named rather than numbered,
        # so Kubernetes needs its UID to check it isn't root.
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: nginxdemos/nginx-hello:plain-text
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
