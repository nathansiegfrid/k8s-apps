apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello-tls
  namespace: hello
spec:
  secretName: hello-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - hello.siegfrid.com

---
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XListenerSet
metadata:
  name: hello
  namespace: hello
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main-gateway
    namespace: gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: hello.siegfrid.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: hello-tls
      allowedRoutes:
        namespaces:
          from: Same
