apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
    - name: public-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - hello.siegfrid.com
  rules:
    - backendRefs:
        - name: hello
          port: 80
